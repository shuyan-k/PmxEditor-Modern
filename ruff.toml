# Ruff 配置：只启用「可能出错」的规则，风格类规则暂不强制。
#
# 未启用 I001（导入排序）：app.py 必须让 native_backend 先于 PyQt5 导入，
# 否则 Windows 先加载 Qt DLL 会导致 _pmx_core 加载失败；自动排序会破坏这个顺序。
# 未启用 E501（行长）与 UP（语法现代化）：现有代码以 % 格式化和较长 QSS 为主，
# 整体改造的收益低于回归成本。
target-version = "py310"
line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E741", # 单字母变量名（矩阵循环里的 l）保持现状
    "B905", # zip() 未指定 strict：长度由上游数组保证
]

[lint.per-file-ignores]
# 色板常量由 globals().update(DARK) 注入，静态分析看不到定义。
"src/pmxeditor/theme.py" = ["F821"]
# 测试为探索式脚本：允许分号压行、路径调整后再导入、动态注入的全局变量。
"tests/**" = ["E401", "E402", "E701", "E702", "B007", "F401", "F841", "F811", "F821"]
