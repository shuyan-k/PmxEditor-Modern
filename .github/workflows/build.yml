name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  NUITKA_VERSION: "4.3.1"
  # 上游 bullet3 没有 3.26 tag；pybullet 3.2.7 的 sdist 内置 Bullet 3.26 源码。
  PYBULLET_VERSION: "3.2.7"
  BULLET_VERSION: "3.26"

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # CI 自行编译原生二进制，不拉取 LFS 里的便携运行时，避免每次多下载约 220 MB。
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "nuitka==$env:NUITKA_VERSION"
          python -m pip check

      # 静态检查仅供参考：规则集见 ruff.toml，偶发误报不阻断打包。
      - name: Lint (ruff)
        continue-on-error: true
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check src tools tests --output-format concise

      - name: Cache Bullet source archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pybullet-${{ env.PYBULLET_VERSION }}.tar.gz
          key: pybullet-${{ env.PYBULLET_VERSION }}-bullet-${{ env.BULLET_VERSION }}

      - name: Fetch Bullet 3.26 sources
        shell: pwsh
        run: |
          $tar = Join-Path $env:RUNNER_TEMP "pybullet-$env:PYBULLET_VERSION.tar.gz"
          if (-not (Test-Path $tar) -or (Get-Item $tar).Length -lt 50MB) {
            curl.exe -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 `
              -o $tar "https://files.pythonhosted.org/packages/source/p/pybullet/pybullet-$env:PYBULLET_VERSION.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "pybullet source download failed" }
          }
          tar -xzf $tar -C $env:RUNNER_TEMP
          $src = Join-Path $env:RUNNER_TEMP "pybullet-$env:PYBULLET_VERSION\src"
          if (-not (Test-Path (Join-Path $src "btBulletDynamicsCommon.h"))) {
            throw "Bullet headers not found in pybullet sdist"
          }
          $version = Select-String -Path (Join-Path $src "LinearMath\btScalar.h") `
            -Pattern '#define BT_BULLET_VERSION (\d+)'
          if (-not $version -or $version.Matches[0].Groups[1].Value -ne "326") {
            throw "expected Bullet 3.26 sources"
          }
          if (Test-Path native\bullet_src) { Remove-Item native\bullet_src -Recurse -Force }
          New-Item -ItemType Directory -Force native\bullet_src | Out-Null
          Copy-Item -Recurse -Force $src native\bullet_src\src

      - name: Build Bullet physics DLL
        run: powershell -ExecutionPolicy Bypass -File native\build.ps1

      - name: Build native compute backend
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File native\build_core.ps1 -Python (Get-Command python).Source

      - name: Verify native artifacts
        shell: pwsh
        run: |
          $dll = Get-Item native\bullet_phys.dll
          if ($dll.Length -lt 100KB) {
            throw "bullet_phys.dll looks like an LFS pointer ($($dll.Length) bytes)"
          }
          $pyd = Get-ChildItem src\pmxeditor\_pmx_core*.pyd | Select-Object -First 1
          if (-not $pyd -or $pyd.Length -lt 50KB) {
            throw "native core extension was not produced"
          }

      - name: Syntax check
        run: python -m compileall -q src tools tests main.py

      - name: Performance benchmark smoke test
        run: python tools\bench_perf.py tests\test_model.pmx --runs 1

      # 原生后端与 NumPy 参考路径的数值对拍（姿态/蒙皮/形态/物理，26 项）。
      # tests/test_model.pmx 是仓库自带夹具，CI 不依赖 tests/parity/work。
      - name: Verify native backend
        run: python tools\verify_native_backend.py tests\test_model.pmx --in-process --runs 1

      - name: Prepare UI assets
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from pmxeditor import theme; theme.svg_assets()"
          if ($LASTEXITCODE -ne 0) { Write-Warning "svg_assets() failed; icons are regenerated at first launch" }
          if (-not (Test-Path assets)) { New-Item -ItemType Directory -Force assets | Out-Null }

      - name: Package onefile executable
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyqt5 `
            --windows-console-mode=disable --msvc=latest --assume-yes-for-downloads `
            --output-dir=dist\release --output-filename=PmxStudio.exe `
            --include-data-dir=assets=assets `
            --include-data-files=native/bullet_phys.dll=native/bullet_phys.dll `
            --include-data-files=src/pmxeditor/_pmx_core.cp312-win_amd64.pyd=pmxeditor/_pmx_core.cp312-win_amd64.pyd `
            --include-module=pmxeditor._pmx_core --include-module=tools.verify_native_backend `
            --include-module=OpenGL.GL --include-package=OpenGL.arrays --include-package=OpenGL.platform `
            --company-name=PmxStudio --product-name=PmxStudio `
            --file-description="PMX model editor" `
            --file-version=1.0.1.0 --product-version=1.0.1.0 main.py

      # SignPath metadata requirements: product name must match the project and
      # product version must be identical across builds.
      - name: Verify executable metadata
        run: |
          $vi = (Get-Item dist\release\PmxStudio.exe).VersionInfo
          "ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion)"
          if ($vi.ProductName -ne "PmxStudio") { throw "unexpected ProductName: $($vi.ProductName)" }
          if ($vi.ProductVersion -ne "1.0.1.0") { throw "unexpected ProductVersion: $($vi.ProductVersion)" }
          if (-not (Test-Path dist\release\PmxStudio.exe)) { throw "executable not produced" }

      - name: Generate release metadata
        shell: pwsh
        run: |
          $exe = "dist\release\PmxStudio.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PmxStudio.exe" | Set-Content "dist\release\PmxStudio.exe.sha256" -Encoding ascii
          $nuitka = (& python -m nuitka --version | Select-Object -First 1)
          @(
            "product=PmxStudio"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "built_at=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "python=$env:PYTHON_VERSION"
            "nuitka=$nuitka"
            "bullet=$env:BULLET_VERSION (pybullet $env:PYBULLET_VERSION)"
          ) | Set-Content "dist\release\BUILD_INFO.txt" -Encoding utf8
          Get-Content "dist\release\BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PmxStudio-windows-x64
          path: |
            dist/release/PmxStudio.exe
            dist/release/PmxStudio.exe.sha256
            dist/release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PmxStudio-windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "PmxStudio $tag" --generate-notes --verify-tag
          fi
          gh release upload "$tag" \
            release/PmxStudio.exe \
            release/PmxStudio.exe.sha256 \
            release/BUILD_INFO.txt \
            --clobber
